<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코알라 하강 게임</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #1a1a1a;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .game-area {
            flex: 1;
            position: relative;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
            overflow: hidden;
        }

        /* 구름 배경 */
        .clouds {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .cloud {
            position: absolute;
            background: white;
            border-radius: 100px;
            opacity: 0.7;
        }

        .cloud::before {
            content: '';
            position: absolute;
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 50%;
            top: -25px;
            left: 10px;
        }

        .cloud::after {
            content: '';
            position: absolute;
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            top: -30px;
            right: 10px;
        }

        /* 게임 오브젝트들 */
        .player {
            position: absolute;
            width: 60px;
            height: 60px;
            font-size: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .obstacle {
            position: absolute;
            width: 50px;
            height: 50px;
            font-size: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 말풍선 */
        .speech-bubble {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 15px;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            white-space: nowrap;
            pointer-events: none;
            z-index: 500;
            animation: fadeOutUp 2s forwards;
        }

        @keyframes fadeOutUp {
            0% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-50px);
            }
        }

        /* 우측 패널 */
        .side-panel {
            width: 320px;
            background: #2a2a2a;
            color: white;
            padding: 20px;
            overflow-y: auto;
            border-left: 3px solid #FFD700;
            display: flex;
            flex-direction: column;
        }

        .panel-section {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #444;
        }

        .panel-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #FFD700;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .info-label {
            color: #aaa;
        }

        .info-value {
            color: #FFD700;
            font-weight: bold;
        }

        .lives-display {
            font-size: 24px;
            margin-bottom: 15px;
        }

        .score-list {
            flex: 1;
            overflow-y: auto;
            max-height: 400px;
        }

        .score-item {
            background: #3a3a3a;
            padding: 8px;
            margin-bottom: 6px;
            border-radius: 5px;
            font-size: 13px;
            border-left: 3px solid #FFD700;
        }

        .score-rank {
            color: #FFD700;
            font-weight: bold;
            margin-right: 10px;
        }

        .score-value {
            color: #4ade80;
            font-weight: bold;
        }

        .score-time {
            font-size: 11px;
            color: #888;
            margin-top: 3px;
        }

        .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .game-over-screen.show {
            display: flex;
        }

        .game-over-content {
            text-align: center;
            color: white;
        }

        .game-over-content h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #FF6B6B;
        }

        .game-over-content p {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .game-over-score {
            font-size: 32px;
            color: #FFD700;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .restart-btn {
            padding: 15px 40px;
            font-size: 20px;
            background: #FFD700;
            color: black;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .restart-btn:hover {
            transform: scale(1.1);
        }

        .altitude-display {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #FFD700;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            z-index: 100;
        }

        .items-legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 100;
        }

        .legend-item {
            margin-bottom: 8px;
        }

        .legend-item:last-child {
            margin-bottom: 0;
        }

        .legend-bad {
            color: #FF6B6B;
            font-weight: bold;
        }

        .legend-good {
            color: #4ade80;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="game-area">
            <div class="clouds" id="cloudsContainer"></div>
            <div class="altitude-display" id="altitudeDisplay">해발: 523,000m</div>
            <div class="player" id="player">🐨</div>
            
            <div class="items-legend">
                <div class="legend-item"><span class="legend-good">✅ ❤️ 하트</span> - 목숨 증가</div>
                <div class="legend-item"><span class="legend-bad">❌ ☄️ 운석</span> - 목숨 감소</div>
                <div class="legend-item"><span class="legend-bad">❌ 🍌 바나나</span> - 속도 감소</div>
            </div>
            
            <div class="game-over-screen" id="gameOverScreen">
                <div class="game-over-content">
                    <h1>게임 오버!</h1>
                    <p>최종 점수</p>
                    <div class="game-over-score" id="finalScore">0m</div>
                    <button class="restart-btn" onclick="location.reload()">다시 시작</button>
                </div>
            </div>
        </div>

        <div class="side-panel">
            <div class="panel-section">
                <div class="panel-title">⏱️ 현재 상태</div>
                <div class="info-row">
                    <span class="info-label">현재 해발</span>
                    <span class="info-value" id="currentAltitude">523,000m</span>
                </div>
                <div class="info-row">
                    <span class="info-label">점수</span>
                    <span class="info-value" id="currentScore">0m</span>
                </div>
                <div class="info-row">
                    <span class="info-label">속도</span>
                    <span class="info-value" id="currentSpeed">150m/s</span>
                </div>
                <div class="lives-display" id="livesDisplay">❤️ ❤️ ❤️</div>
            </div>

            <div class="panel-section">
                <div class="panel-title">🏆 기록</div>
                <div class="score-list" id="scoreList">
                    <div style="color: #aaa; text-align: center;">기록이 없습니다</div>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
